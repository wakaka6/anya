name: release

# A tag vX.Y.Z builds Anya for macOS and Linux (arm64, amd64), publishes the
# archives with SHA256SUMS, and updates the Homebrew tap's formula
# (docs/decisions/0014). The tap is written last, so a formula never names an
# archive that is not published yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAP: wakaka6/homebrew-tap

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-14, name: anya_darwin_arm64 }
          - { os: macos-15-intel, name: anya_darwin_amd64 }
          - { os: ubuntu-22.04, name: anya_linux_amd64 }
          - { os: ubuntu-22.04-arm, name: anya_linux_arm64 }
    # Linux builds on the oldest supported Ubuntu: the binary needs the glibc
    # it was built against or newer, so 22.04 also runs on Debian 12 and later.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Anya compares its own version with the formula's, so a tag that is not
      # the version in Cargo.toml would announce an update forever.
      - name: The tag is the crate version
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="anya"))')"
          test "v${crate}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says ${crate}"; exit 1; }
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libasound2-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxtst-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p anya
      - name: Archive
        run: |
          tar -C target/release -czf "${{ matrix.name }}.tar.gz" anya
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum anya_*.tar.gz > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/anya_*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Formula
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SUMS_FILE: dist/SHA256SUMS
        run: scripts/render-formula > anya.rb
      - name: Tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          test -n "${TAP_TOKEN}" || { echo "secret TAP_TOKEN (write access to ${TAP}) is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp anya.rb tap/Formula/anya.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/anya.rb
          git commit -m "anya ${GITHUB_REF_NAME#v}"
          git push
