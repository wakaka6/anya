# cargo deny check: licences, advisories, sources. Layer rules are in xtask/src/arch.rs.

[graph]
# Linux and macOS only (docs/decisions/0001); Windows-only crates are not our graph.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained; only gtk 0.18 (Linux tray and webview) builds with it, at compile time.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk 0.18; goes when gtk does" },
    # ttf-parser is unmaintained; ab_glyph reads the system's installed fonts with it for the Linux overlay.
    { id = "RUSTSEC-2026-0192", reason = "parses only installed system fonts, via ab_glyph in the Linux overlay" },
]

[licenses]
version = 2
# Permissive licences only, so the choice in docs/decisions/0006 stays open.
# Copyleft (MPL, LGPL, GPL) stays out; ask before adding one.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Allowed by the owner for this crate only (MPL-2.0 is file-level copyleft;
# option-ext is used unmodified, via tray-icon -> dirs).
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
# Workspace crates are unpublished and have no licence yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
