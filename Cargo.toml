[workspace]
resolver = "3"
# Every member needs a layer in xtask/src/arch.rs; `cargo test` fails otherwise.
members = ["crates/protocol", "crates/core", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
# The licence is undecided (docs/decisions/0006-licence-pending.md).
publish = false

[workspace.dependencies]
anya-protocol = { path = "crates/protocol" }
anya-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
