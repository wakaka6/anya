[package]
name = "anya-audio"
description = "Capture on Linux and macOS behind anya-core's AudioSource."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anya-core.workspace = true
cpal = "0.18"
hound = "3.5"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# System sound on Linux: the default output's monitor source (PipeWire serves it too).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[lints]
workspace = true
