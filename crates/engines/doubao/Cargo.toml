[package]
name = "anya-engine-doubao"
description = "Doubao streaming recognition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anya-core.workspace = true
anya-protocol.workspace = true
flate2 = "1"
futures-util.workspace = true
# tokio-tungstenite enables rustls without a crypto provider; wss:// needs one.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints]
workspace = true
