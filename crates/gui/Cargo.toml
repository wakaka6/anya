[package]
name = "anya-gui"
description = "The settings page, the desktop window and tray, and --web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anya-config.workspace = true
anya-i18n.workspace = true
anya-protocol.workspace = true
anya-runtime.workspace = true
serde.workspace = true
# desktop
png = "0.18"
tao = "0.37"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "net", "time", "macros"] }
tracing.workspace = true
tray-icon = "0.26"
wry = "0.57"
# web
anya-core.workspace = true
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json.workspace = true
subtle = "2.6"

[lints]
workspace = true

[dev-dependencies]
# desktop
anya-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

# desktop
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }

# desktop
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
