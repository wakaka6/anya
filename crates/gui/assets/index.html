<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="gui.title"></title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="drag" id="dragSide"></div>
      <nav id="nav" class="nav" data-i18n-aria="gui.nav.label"></nav>
      <div id="engineLine" class="engine-line" data-state="missing"></div>
    </aside>

    <div class="content" id="content">
      <div class="topbar" id="dragMain"><span id="barTitle" class="bar-title"></span></div>
      <main class="pane" id="pane" tabindex="-1">
        <p id="loadError" class="banner error" hidden></p>
        <div id="page"></div>
      </main>
    </div>
  </div>

  <div id="install" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="installTitle">
      <div class="sheet-head">
        <h2 id="installTitle"></h2>
      </div>
      <div id="installBody"></div>
      <div class="sheet-foot">
        <span class="spacer"></span>
        <button type="button" id="installCancel" class="ghost" data-i18n="common.cancel"></button>
        <button type="button" id="installConfirm" class="main" data-i18n="gui.plugins.install"></button>
      </div>
    </div>
  </div>

  <div id="pairing" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pairingTitle">
      <div class="sheet-head">
        <h2 id="pairingTitle" data-i18n="gui.pairing.title"></h2>
        <p class="muted" data-i18n="gui.pairing.intro"></p>
      </div>
      <div class="pairing-body">
        <div id="pairingQr" class="qr" role="img" data-i18n-aria="gui.pairing.qr_label"></div>
        <div class="pairing-facts">
          <span class="muted" data-i18n="gui.pairing.code"></span>
          <b id="pairingCode" class="pairing-code"></b>
          <p id="pairingCountdown" class="note"></p>
          <span class="muted" data-i18n="gui.pairing.url"></span>
          <code id="pairingUrl"></code>
          <span class="muted" data-i18n="gui.pairing.fingerprint"></span>
          <code id="pairingFingerprint"></code>
        </div>
      </div>
      <p id="pairingError" class="field-error" role="alert" hidden></p>
      <div class="sheet-foot">
        <button type="button" id="pairingNew" class="ghost" data-i18n="gui.pairing.new"></button>
        <span class="spacer"></span>
        <button type="button" id="pairingDone" class="main" data-i18n="gui.pairing.done"></button>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
