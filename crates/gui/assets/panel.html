<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="common.app_name"></title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body class="panel">
  <div id="wrap" class="panel-wrap">
    <header class="panel-head">
      <img class="logo" src="icon.svg" alt="">
      <strong data-i18n="common.app_name"></strong>
      <span id="status" class="status"><i id="statusDot" class="dot"></i><span id="statusLabel"></span></span>
    </header>

    <div id="update" hidden></div>
    <div id="top"></div>
    <div id="switches" class="switches"></div>

    <section id="recentBox" class="recent">
      <div class="recent-head">
        <h2 data-i18n="gui.panel.recent"></h2>
        <span id="totals" class="totals"></span>
      </div>
      <ul id="recent"></ul>
    </section>

    <nav id="panelFoot" class="panel-tools">
      <button type="button" id="history" class="tool" data-i18n-title="gui.panel.history" data-i18n-aria="gui.panel.history"></button>
      <button type="button" id="settings" class="tool" data-i18n-title="gui.panel.settings" data-i18n-aria="gui.panel.settings"></button>
      <span class="spacer"></span>
      <button type="button" id="quit" class="tool quit" data-i18n-title="gui.panel.quit" data-i18n-aria="gui.panel.quit"></button>
    </nav>
  </div>

  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
