[package]
name = "anya-hotkey"
description = "Global hotkeys on macOS, Wayland and X11."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anya-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# The macOS backend's dependencies (src/darwin.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDate", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

# The Linux backends' dependencies (src/devinput.rs, src/xi2.rs, src/doctor.rs).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", default-features = false, features = ["poll", "user"] }
x11rb = { version = "0.14", features = ["xinput"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }

[lints]
workspace = true
